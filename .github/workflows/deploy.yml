name: Deploy to Azure VM
# Manual trigger. Needs repo secrets: VM_HOST (the VM's DNS name), VM_USER (azureuser), VM_SSH_KEY (private key).
# NOTE: GitHub's runners need SSH access to the VM, so set ssh_allowed_cidr appropriately in Terraform
# (key-only login + fail2ban are enabled). Otherwise, deploy by hand with: git pull && docker compose -f docker-compose.prod.yml up -d --build
on: workflow_dispatch
jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy over SSH
        env:
          HOST: ${{ secrets.VM_HOST }}
          USER_: ${{ secrets.VM_USER }}
          KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          install -m 600 /dev/null key && printf '%s\n' "$KEY" > key
          ssh -i key -o StrictHostKeyChecking=accept-new "$USER_@$HOST" \
            "cd ~/stockspot && git pull --ff-only && docker compose -f docker-compose.prod.yml up -d --build && docker image prune -f"
